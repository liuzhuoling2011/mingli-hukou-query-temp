<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>户籍查询 · 明理高中</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #1a2332;
    --muted: #5b6b7c;
    --line: #e3eaf2;
    --primary: #1f6feb;
    --primary-press: #1557c0;
    --ok: #0f7b4c;
    --ok-bg: #e8f8ef;
    --warn: #b45309;
    --warn-bg: #fff7e8;
    --err: #b42318;
    --err-bg: #fef3f2;
    --shadow: 0 10px 30px rgba(26, 35, 50, 0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #e0e7ff 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.6;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 48px;
  }
  header {
    text-align: center;
    margin-bottom: 22px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--primary);
    background: #eaf2ff;
    border: 1px solid #d5e5ff;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 1.55rem;
    margin: 0 0 8px;
    font-weight: 700;
  }
  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px;
  }
  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .field { margin-bottom: 16px; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    background: #fbfdff;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus {
    border-color: #93c5fd;
    box-shadow: 0 0 0 4px rgba(31, 111, 235, 0.12);
    background: #fff;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    padding: 12px 16px;
  }
  .btn-primary {
    flex: 1;
    color: #fff;
    background: var(--primary);
  }
  .btn-primary:hover { background: var(--primary-press); }
  .btn-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .btn-ghost {
    color: var(--muted);
    background: #f3f6fa;
    border: 1px solid var(--line);
  }
  #result {
    margin-top: 18px;
    display: none;
  }
  .result-box {
    border-radius: 14px;
    padding: 16px 16px 14px;
    border: 1px solid transparent;
  }
  .result-box.ok { background: var(--ok-bg); border-color: #b7ebc9; color: var(--ok); }
  .result-box.warn { background: var(--warn-bg); border-color: #fcd9a0; color: #92400e; }
  .result-box.err { background: var(--err-bg); border-color: #fecdca; color: var(--err); }
  .result-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .result-desc {
    margin: 0;
    font-size: 0.95rem;
    color: inherit;
    opacity: 0.95;
  }
  .materials {
    margin: 14px 0 0;
    padding: 0;
    list-style: none;
    counter-reset: mat;
  }
  .materials li {
    counter-increment: mat;
    position: relative;
    background: #fff;
    border: 1px solid #f1e3c8;
    border-radius: 12px;
    padding: 12px 12px 12px 44px;
    margin-bottom: 8px;
    color: var(--ink);
    font-size: 0.92rem;
  }
  .materials li::before {
    content: counter(mat);
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f59e0b;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 24px;
    text-align: center;
  }
  .note {
    margin-top: 18px;
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
  }
  footer {
    margin-top: 22px;
    text-align: center;
    color: #8a97a8;
    font-size: 0.78rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge">明理高中 · 内部查询</div>
      <h1>学生户籍查询</h1>
      <p class="sub">请输入学生姓名与身份证号，查询是否属于省外户籍，以及是否需要提交随迁材料。</p>
    </header>

    <div class="card">
      <form id="queryForm" autocomplete="off">
        <div class="field">
          <label for="name">学生姓名</label>
          <input id="name" name="name" type="text" placeholder="请输入与学籍一致的姓名" required maxlength="30" />
        </div>
        <div class="field">
          <label for="idno">身份证号</label>
          <input id="idno" name="idno" type="text" placeholder="18 位身份证号" required maxlength="18" inputmode="text" />
          <div class="hint">末位为 X 时请用大写或小写字母均可</div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submitBtn">查询</button>
          <button type="button" class="btn-ghost" id="resetBtn">清空</button>
        </div>
      </form>

      <div id="result" aria-live="polite"></div>
    </div>

    <p class="note">本页数据已加密嵌入，仅在姓名与身份证号同时正确时才能解密对应结果。请勿截图传播他人信息。</p>
    <footer>数据仅供本校户籍材料核验使用</footer>
  </div>

function normalizeName(s) {
  return String(s || "").replace(/\s+/g, "").toUpperCase();
}
function normalizeId(s) {
  return String(s || "").trim().replace(/\s+/g, "").toUpperCase();
}
function concatBytes(...parts) {
  const total = parts.reduce((n, p) => n + p.length, 0);
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function toHex(buf) {
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function sha256(bytes) {
  return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
}
async function derive(name, idno) {
  const material = new TextEncoder().encode(`${normalizeName(name)}|${normalizeId(idno)}`);
  const lookupHash = toHex(await sha256(concatBytes(new TextEncoder().encode("lookup|"), material, PEPPER)));
  const aesKeyRaw = await sha256(concatBytes(new TextEncoder().encode("aes|"), material, PEPPER));
  const aesKey = await crypto.subtle.importKey("raw", aesKeyRaw, { name: "AES-GCM" }, false, ["decrypt"]);
  return { lookupHash, aesKey };
}
async function decryptRecord(aesKey, b64) {
  const raw = b64ToBytes(b64);
  const nonce = raw.slice(0, 12);
  const data = raw.slice(12);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, aesKey, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

}
function renderOut() {
  const items = MATERIALS.map(t => `<li>${t}</li>`).join("");
  return `
    <div class="result-box warn">
      <p class="result-title">查询结果：省外户籍</p>
      <p class="result-desc">该学生属于省外户籍（随迁子女）。请家长准备并提交以下 7 项材料：</p>
      <ol class="materials">${items}</ol>
    </div>`;
}
function renderUnknown() {
  return `
    <div class="result-box err">
      <p class="result-title">已找到记录，但户籍类别未完整录入</p>
      <p class="result-desc">请联系学校教务或班主任核对纸质名单后再办理。</p>
    </div>`;
}
function renderNotFound() {
  return `
    <div class="result-box err">
      <p class="result-title">未查询到匹配信息</p>
      <p class="result-desc">请核对姓名与身份证号是否与学籍信息一致。若确认无误仍无法查询，请联系学校工作人员。</p>
    </div>`;
}

document.getElementById("queryForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value;
  const idno = document.getElementById("idno").value;
  const btn = document.getElementById("submitBtn");
  if (!normalizeName(name) || !normalizeId(idno)) {
    showResult(`<div class="result-box err"><p class="result-title">请填写完整信息</p><p class="result-desc">姓名和身份证号都不能为空。</p></div>`);
    return;
  }
  if (normalizeId(idno).length !== 18) {
    showResult(`<div class="result-box err"><p class="result-title">身份证号格式不正确</p><p class="result-desc">请输入 18 位身份证号。</p></div>`);
    return;
  }
  btn.disabled = true;
  btn.textContent = "查询中…";
  try {
    const { lookupHash, aesKey } = await derive(name, idno);
    const blob = RECORDS[lookupHash];
    if (!blob) {
      showResult(renderNotFound());
      return;
    }
    const payload = await decryptRecord(aesKey, blob);
    if (payload.s === "in") showResult(renderIn());
    else if (payload.s === "out") showResult(renderOut());
    else showResult(renderUnknown());
  } catch (err) {
    console.error(err);
    showResult(`<div class="result-box err"><p class="result-title">查询失败</p><p class="result-desc">解密或校验出错，请刷新页面后重试。若持续失败，请联系学校。</p></div>`);
  } finally {
    btn.disabled = false;
    btn.textContent = "查询";
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("queryForm").reset();
  const el = document.getElementById("result");
  el.style.display = "none";
  el.innerHTML = "";
});
</script>
</body>
</html>
